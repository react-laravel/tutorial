name: Deploy Three.js and Tutorial to B

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-b
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tutorial links
        run: pnpm run check:tutorials
      - name: Build standalone runtime once for both sites
        run: |
          pnpm run build
          pnpm run package:runtime
          du -sh .deploy-runtime
      - name: Publish to server B and retain one version
        env:
          B_DEPLOY_SSH_KEY: ${{ secrets.B_DEPLOY_SSH_KEY }}
          B_DEPLOY_KNOWN_HOSTS: ${{ secrets.B_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-to-b.sh
      - name: Remove temporary upload bundle
        if: always()
        run: rm -rf .deploy-runtime
